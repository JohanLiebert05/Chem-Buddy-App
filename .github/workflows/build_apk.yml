name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-msc-apk
          path: Chem-Buddy-MSc-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Chem-Buddy-MSc-Release.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }}
            - Complete 4-Branch MSc Chemistry Parity (Organic, Inorganic, Physical, Analytical).
            - ChemBuddy Mascot & Design System.
            - Spaced repetition flashcards & university exam mode.
            - Offline-first caching with exponential backoff load management.
