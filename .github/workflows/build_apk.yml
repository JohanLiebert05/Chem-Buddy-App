name: Validate and publish ChemBuddy Android
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    name: Validate and package Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check backend authorization
        run: |
          deno check supabase/functions/ask-gemini-orchestrator/index.ts supabase/functions/ingest-document/index.ts supabase/functions/ask-chembuddy/index.ts supabase/functions/generate-flashcards/index.ts supabase/functions/generate-quiz/index.ts supabase/functions/predict-important-questions/index.ts supabase/functions/predict-reaction/index.ts supabase/functions/explain-reaction/index.ts
          deno test --allow-env supabase/functions/_shared/access_test.ts
      - name: Check database permissions
        run: |
          npm ci --prefix tool/database_tests
          npm test --prefix tool/database_tests
      - name: Build validation APK
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch')
        run: flutter build apk --debug
      - name: Choose mobile build signing
        id: signing
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chembuddy-release.jks"
            chmod 600 "$RUNNER_TEMP/chembuddy-release.jks"
            echo "preview=false" >> "$GITHUB_OUTPUT"
          else
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "Production signing is not configured; building the separate ChemBuddy Preview app for mobile testing."
          fi
      - name: Build mobile APK
        if: steps.signing.outputs.preview != ''
        env:
          CHEMBUDDY_PREVIEW_BUILD: ${{ steps.signing.outputs.preview }}
          CHEMBUDDY_KEYSTORE_PATH: ${{ steps.signing.outputs.preview == 'false' && format('{0}/chembuddy-release.jks', runner.temp) || '' }}
          CHEMBUDDY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHEMBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHEMBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Prepare versioned download
        id: version
        if: steps.signing.outputs.preview != ''
        env:
          PREVIEW: ${{ steps.signing.outputs.preview }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          SUFFIX=""
          if [ "$PREVIEW" = "true" ]; then SUFFIX="-preview"; fi
          APK="ChemBuddy-v$VERSION$SUFFIX.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v$VERSION-by-Prajwal-A-Kambar.apk"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp RELEASE_NOTES.md release-body.md
          if [ "$PREVIEW" = "true" ]; then
            printf '\n## Mobile test build\n\nThis APK is the separate **ChemBuddy Preview** app, signed for testing. It installs alongside the existing app. Production signing secrets were unavailable. Use it to test 3.5.4 on your phone; it is not an in-place production update.\n' >> release-body.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chembuddy-android-${{ github.sha }}
          path: |
            ChemBuddy-v*.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Align release tag with verified APK
        if: steps.version.outputs.tag != '' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          TAG_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq "map(select(.ref == \"refs/tags/$RELEASE_TAG\"))[0].object.sha // empty")
          if [ -n "$TAG_HEAD" ] && [ "$TAG_HEAD" != "$GITHUB_SHA" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=false > /dev/null
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.tag != ''
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.version.outputs.apk }}
            ChemBuddy-v*-by-Prajwal-A-Kambar.apk
          name: ChemBuddy ${{ steps.version.outputs.version }} by Prajwal A Kambar
          prerelease: ${{ steps.signing.outputs.preview == 'true' }}
          body_path: release-body.md
          fail_on_unmatched_files: false
