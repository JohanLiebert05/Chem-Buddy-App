name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.1-by-Prajwal-A-Kambar.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.1-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.5.1-apk
          path: ChemBuddy-v3.5.1-by-Prajwal-A-Kambar.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.5.1-by-Prajwal-A-Kambar.apk
            ChemBuddy-v3.5.1-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
          body: |
            # ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
            
            > **Chem Buddy by Prajwal A Kambar** — attendance, tests, and notes for MSc Chemistry students.
            
            ---
            
            ### ✨ What's New & Upgraded in ${{ github.ref_name }}:
            
            #### 🌐 1. Gemini AI Internet Reaction Predictor & Electron-Pushing Mechanism
            - **Online Gemini AI Intelligence**: Automatically queries active Gemini models (`gemini-2.5-flash`, `gemini-2.0-flash`, `gemini-1.5-flash`) via the multi-key pool over the internet.
            - **Step-by-Step Mechanisms**: Details complete reaction mechanisms with step titles, nucleophile/electrophile descriptions, and curved electron-pushing arrow notations (`curvedArrows`).
            - **Deep Reaction Insights**: Displays reaction classification (e.g. `[4+2] Cycloaddition`, `Electrophilic Aromatic Substitution`), driving forces (aromatization, ring strain relief), regiochemistry rules, and viva exam Q&As.
            - **Zero-Dead-End Offline Fallback**: Intelligently synthesizes offline fallback adducts if internet or API keys are unavailable.
            
            #### 🎨 2. Publication-Quality 2D Vector SVG ChemDraw Rendering
            - **True 2D Vector Graphics**: Replaced raw text boxes with crisp vector SVGs rendered directly inside the prediction bottom sheet.
            - **Curated Complex Architectures**: Norbornene-derived Diels-Alder adducts, benzonorbornadienes, dicyclopentadiene, biphenyls, and functionalized monocycles rendered with textbook bond lengths and CPK heteroatom badges.
            
            #### 🧪 3. Canvas Graph-to-SMILES BFS/DFS Parsing
            - **Connected-Component Fragment Partitioning**: Resolves multiple disconnected molecules on the canvas into dot-separated SMILES (e.g., `C1=CCC=C1.c1ccccc1`).
            - **Canonical Motif Recognition**: Instantly detects standard rings (Benzene, Cyclopentadiene, Cyclopentene, Pyridine, Furan, Thiophene) and traverses spanning trees with correct ring closure numbers.
            
            #### ⏰ 4. IST 8:30 AM Timetable Briefing & 1-Tap Class Attendance Alerts
            - **Strict IST Enforced**: All notifications anchored to `Asia/Kolkata` timezone.
            - **1-Tap Action Shade**: Class reminders now have direct `Present ✅` and `Absent ❌` action buttons to log attendance without opening the app.
            
            #### 🧠 5. Daily Psychology Facts Notifications
            - **120+ Curated Facts**: Inspired by the "Psychology Facts" app, rotating daily once at 8:00 PM with zero repeats.
            
            #### 🛡️ 6. Verification & Stability
            - 100% passing test suite across all services and widgets.
            - Zero errors, zero warnings, zero lints on `flutter analyze`.
            
            ---
            *Developed with ❤️ by Prajwal A Kambar*



