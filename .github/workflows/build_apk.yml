name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v2.8.1-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v2.8.1-apk
          path: ChemBuddy-v2.8.1-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v2.8.1-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 2.8.1)
            
            ### ✨ What's New in v2.8.1:
            - **Official ChemBuddy App Logo & Launcher Icons**:
              - New high-resolution ChemBuddy scholar mascot medallion logo with safety goggles, lab coat, bubbling flask, and atomic elements badge.
              - Full Android adaptive & mipmap launcher icons (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`) and iOS app icon sets.
              - In-app animated branding with dynamic neon pulsing and fallback vector painting.
            - **Handwritten & Scanned PDF OCR Learning Upgrade**:
              - Multi-engine document processing for digital PDFs, scanned notes, and handwritten MSc Chemistry notes.
              - Chemistry-specific OCR normalization: $O \leftrightarrow 0$ corrections, elemental formula subscripting, valence charge superscripts (`Fe³⁺`, `SO₄²⁻`), and reaction arrows (`→`, `⇌`, `Δ`, `hν`).
              - Strict source-grounding prompt architecture ensuring all generated flashcards, quizzes, and AI answers derive strictly from uploaded documents without hallucination.
              - Per-page extraction inspector sheet and document quality indicators.
            - **Quality & Performance**:
              - 100% automated test suite passing (185+ unit & integration tests).
              - Zero static analysis warnings (`flutter analyze`).
