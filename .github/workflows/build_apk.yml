name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.1.2-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.1.2-apk
          path: ChemBuddy-v3.1.2-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.1.2-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.1.2)
            
            ### ✨ What's New in v3.1.2:
            - **Smart PDF-to-Quiz Generator**:
              - Document understanding before generation: domain classification, concept & formula extraction, and page mapping.
              - Primary source of truth: 100% grounded in uploaded PDF with zero hallucinations.
              - Smart Quiz, High Priority, and Custom modes with 10, 20, 30, 40 questions.
              - Remediation loop: "Practice Weak Topics" to generate targeted follow-up quizzes from same PDF.
            - **ChemBuddy AI Chat Redesign & Answer Modes**:
              - Normal concise mode by default; MSc in-depth mode on request (2M, 5M, 10M, MSc Concept).
              - Math parser fix: zero internal placeholders (`DISPLAY_MATH_0`) leak.
            - **Accelerated Flashcard Generation**:
              - In-memory response caching and single-call fast path for sub-second flashcard creation.
            - **Smoother Navigation**:
              - Silky cross-fade page transitions and tactile spring-scaling bottom nav tabs.
            - **Quality & Performance**:
              - 100% automated test suite passing (254 unit & widget tests).
              - Zero static analysis issues (`flutter analyze`).
