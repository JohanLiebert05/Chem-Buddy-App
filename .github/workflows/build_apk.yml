name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.2-by-Prajwal-A-Kambar.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.2-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.5.2-apk
          path: ChemBuddy-v3.5.2-by-Prajwal-A-Kambar.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.5.2-by-Prajwal-A-Kambar.apk
            ChemBuddy-v3.5.2-Release.apk
            Chem-Buddy-MSc-Release.apk
            ChemBuddy_v3.5.2_Complete_User_Manual.pdf
            ChemBuddy_v3.5.2_Complete_User_Manual.doc
          name: ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
          body: |
            # ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
            
            > **Chem Buddy by Prajwal A Kambar** — attendance, tests, and notes for MSc Chemistry students.
            
            ---
            
            ### ✨ What's New & Upgraded in ${{ github.ref_name }}:
            
            #### 👤 1. Personalized Student Name & Decluttered Home Header
            - **Personalized Header**: Replaced the generic "Chemist" label with the student's actual name entered during login or registration (e.g. *"Good morning, Prajwal 👋"* or *"In the flow, Prajwal 📚"*).
            - **Decluttered 65px Layout**: Font size reduced to crisp 17px with single-line overflow truncation, eliminating bulky line wrapping and saving vertical screen real estate.
            - **Full Name on Sign-In**: Login screen now includes the Full Name field on both Sign In and Sign Up tabs.
            
            #### ⚗️ 2. Publication-Grade Reaction Mechanism Dossier & Compendium Export
            - **Academic PDF Dossier**: Single reaction or complete MSc compendium export featuring 0.5-inch margins, deep purple styling, visual reaction scheme with SVG annotations, and detailed step-by-step mechanisms with curved arrow electron flows and intermediate geometries.
            - **Excel Spreadsheet (CSV / XLV Format)**: Encoded with UTF-8 BOM for 1-click opening in Microsoft Excel. Features a structured step-by-step mechanism table and complete vector SVG markup code.
            - **Standalone Vector SVG Diagram (.svg)**: 1-click export of standalone `.svg` vector files ready for ChemDraw, PowerPoint, Word, or web publishing.
            - **1-Tap Direct Export**: Share and export icons added directly to the Reaction Mechanisms catalog and detail screens.
            
            #### 📊 3. Academic Audit & Attendance Export System
            - **Official Attendance PDF**: Student info card, executive KPI cards (Overall %, Counted Sessions, Present, Absent, OD, Academic Standing), and subject-by-subject breakdown with safe skips / classes needed prescriptions.
            - **Attendance Excel Spreadsheet**: UTF-8 BOM, subject metrics with 75% and 80% targets, and chronological session logs.
            
            #### 📖 4. Complete Visual Operating Manual v3.5.2
            - Fully updated operating manuals in **PDF** (1.5 MB with embedded screenshots), **Word DOC**, and **Markdown** formats.
            
            #### 🌐 5. Gemini AI Reaction Predictor & 2D Vector SVG Generator
            - Online Gemini AI mechanism prediction with curved arrows, reaction classification, and 45+ instant offline fallback rules.
            
            #### ⏰ 6. IST 8:30 AM Briefing & 1-Tap Attendance Alerts
            - Asia/Kolkata timezone enforced, 1-tap Present/Absent action buttons in Android notification shade, and daily 8:00 PM Psychology Facts.
            
            ---
            *Developed with ❤️ by Prajwal A Kambar*



