name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.6-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.6-apk
          path: ChemBuddy-v3.4.6-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.6-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.6)
            
            ### ✨ What's New & Upgraded in v3.4.6:
            - **ChemDraw Masterclass Interactive Guide & Pro Tools**:
              - Professional 5-step interactive walkthrough guide for ChemDraw Canvas: Canvas Essentials, Advanced MSc Rings (Indole, Crown Ether, Ferrocene, Naphthalene, etc.), Quick Functional Groups (—OH, —NH₂, —COOH, —CHO, —NO₂, —CN), Reaction Mechanisms with Arrows & Fragment Detection, and a practical 4-step synthesis example of Aspirin with 1-tap instant canvas load.
              - Dedicated Help (`?`) action button in AppBar + first-time auto-guide popup.
            - **Domain-Specialized Ask ChemBuddy AI**:
              - ⚡ **Quick Answer (Science)**: Strictly dedicated to Chemistry, Physics, Biochemistry, Biology, Spectroscopy, and Scientific Calculations. Gracefully redirects general chat to General AI.
              - 🌐 **General Gemini AI**: Full unconstrained multimodal Google Gemini intelligence for general-purpose queries, study plans, essays, and coding.
            - **Student Name Greeting & Resolution**:
              - Intelligent name filtering prevents registration or roll numbers from appearing as names in greetings and avatar initials.
            - **Bidirectional Attendance Timetable Switcher**:
              - Instant 1-tap switching between **Inorganic Timetable 🧪** and **Organic Timetable ⚗️** directly within the Attendance screen photo banner with live schedule and thumbnail updates.
            - **Restored App Descriptions & Onboarding Features**:
              - Restored original app description (*Chem Buddy by Prajwal A Kambar — attendance, tests, and notes for MSc Chemistry students*) across initial splash, onboarding tour, and beginner tutorials.
            - **Branding & Versioning**:
              - Displays ChemBuddy v3.4.6 and *Developed by Prajwal A Kambar*. Removed Supabase references.
            - **Automated Verification**:
              - Complete test suite passing (346+ tests) with 0 errors, 0 warnings, and 0 analyzer issues.

