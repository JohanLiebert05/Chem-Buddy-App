name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.2.0-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.2.0-apk
          path: ChemBuddy-v3.2.0-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.2.0-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.2.0)
            
            ### 🧪 What's New in v3.2.0:
            - **Organic Reaction Predictor & Mechanism Viewer**:
              - **Curated MSc Reaction Engine**: 35 core postgraduate organic named reactions (Aldol, Diels-Alder, Wittig, Robinson Annulation, Stille, Suzuki-Miyaura, Heck, Sharpless, Birch, etc.) with zero cloud latency.
              - **Animated Electron-Pushing Mechanisms**: Step-by-step interactive viewer with animated curved electron flow arrows (heterolytic double-barbed and homolytic single-barbed radical fishhooks) rendered in crisp vector SVG.
              - **Rich Reaction Pedagogy**: In-depth explanations covering stereochemistry, regiochemistry, frontier molecular orbitals (HOMO/LUMO), thermodynamic driving forces, and pKa considerations.
              - **Seamless Chemical Sketcher Integration**: Send molecules drawn in ChemDraw / Ketcher canvas straight into the predictor with a single tap.
              - **AI-Powered Fallback**: Multi-key Gemini load balancing edge function with automatic failover for predicting reactions beyond the local database.
            - **Quality & Stability**:
              - 100% automated test suite passing across all unit, widget, and chemistry engine tests.
              - 0 static analysis warnings (`flutter analyze`).
