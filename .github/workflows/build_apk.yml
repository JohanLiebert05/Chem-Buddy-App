name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.5-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.5-apk
          path: ChemBuddy-v3.4.5-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.5-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.5)
            
            ### ✨ What's New & Upgraded in v3.4.5:
            - **Google Pixel-Grade Material 3 Expressive Motion**:
              - **Fluid, State-Preserving Tab Switching**: Implemented `_AnimatedFadeIndexedStack` in `MainShell` using `Curves.easeOutCubic` and subtle forward scaling (`0.985` → `1.0`, 220ms). Eliminates abrupt cuts while preserving 100% of underlying tab state, scroll positions, and sketcher canvases.
              - **FadeForwards Page Transitions**: Configured `AppTheme.dark` with `FadeForwardsPageTransitionsBuilder` across routes for smooth, native Android 14/15 Pixel-style page navigation.
            - **120Hz High Refresh Rate Native Optimization**:
              - Updated `MainActivity.kt` with Android API 23+ window attributes querying `supportedModes` and requesting `preferredDisplayModeId` for maximum available refresh rate (90Hz / 120Hz / 144Hz).
              - Replaced stiff scrolling physics across Exam Mode and Hub lists with fluid `BouncingScrollPhysics()` tuned for 120fps display performance.
            - **Tactile Smart Haptics**:
              - Guarded all haptic feedback calls in `AppHaptics` with exception handling to prevent crashes across all devices and platforms.
              - Cleaned up tab switching haptics: crisp `selection()` on flat tabs and affirming `confirm()` on the central floating Ask AI button with no redundant double clicks.
            - **Exam Mode: Zero Raw Text**:
              - Converted all Exam Mode question titles, examiner tips, marking breakdown points, self-assessment criteria, pitfalls, and feedback notes to full `ChemistryMarkdownView` rendering.
              - Full native support for LaTeX equations, sub/superscript chemical formulas (`H₂SO₄`, `[CoCl₄]²⁻`), and structured academic tables.
            - **Automated Verification**:
              - 100% pass rate across entire test suite with 0 analyzer issues or warnings.

