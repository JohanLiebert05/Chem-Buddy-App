name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.4-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.4-apk
          path: ChemBuddy-v3.4.4-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.4-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.4)
            
            ### 🔬 What's New & Upgraded in v3.4.4:
            - **Minimalist, Clean Login Page**: Completely redesigned login and signup with crisp typography, a sleek segmented `[ Sign In ] | [ Create Account ]` switcher, context-aware fields (Full Name shown only when creating an account), password visibility toggle, and minimalist sentence phrasing.
            - **Intelligent Starting Info Tour**: Upgraded the interactive 7-step tour to showcase ChemBuddy's flagship capabilities:
              1. **ChemDraw Smart Canvas**: Interactive 2D sketcher, aromatic fused ring templates (Benzene, Cyclohexane, Naphthalene, Indole, Ferrocene), functional group palette, and reaction arrows with AI prediction.
              2. **Live ChemBuddy AI**: Google Gemini reasoning for mechanisms, spectroscopy interpretation, and the new ✨ General AI mode.
              3. **Handwritten Notes to Flashcards**: Multi-page camera & gallery OCR extraction for active recall study sets.
              4. **Attendance Intelligence**: Real-time 75% safe-margin buffer ("Can Skip" counts) & recovery roadmaps.
              5. **Smart Timetable**: Instant department presets (Organic & Inorganic) with pinch-to-zoom photo references.
              6. **5-Step Academic Workflow**: Proven daily student routine for top marks in university exams.
            - **App Guides Update**: Added dedicated ChemDraw guide card accessible anytime from settings.
            - **100% Passing Automated Tests & Clean Lints**: All unit, widget, and layout tests pass with 0 analyzer issues.

