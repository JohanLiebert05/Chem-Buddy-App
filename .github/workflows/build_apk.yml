name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.3.0-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.3.0-apk
          path: ChemBuddy-v3.3.0-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.3.0-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.3.0)
            
            ### 🎨 What's New in v3.3.0 — ChemDraw Intelligence Upgrade:
            - **"+" Reactant Separator**: Automatically renders a cyan "+" symbol between disconnected molecular fragments on the canvas.
            - **Reaction Arrow Tool (→)**: Draw horizontal reaction arrows to visually separate reactants and products.
            - **Eraser Tool (🧹)**: Granular deletion — tap atoms or bonds to remove them individually.
            - **Redo Support (↷)**: Full undo/redo stack for non-destructive editing.
            - **Functional Group Palette**: Quick-insert —OH, —NH₂, —COOH, —CHO, —NO₂, —CN with one tap.
            - **Pinch-to-Zoom & Pan**: Two-finger zoom and pan with reset-view button.
            - **Smart Snap Preview**: Ghost bond preview when hovering near existing atoms.
            - **6 New MSc Templates**: Naphthalene, Indole, Imidazole, Thiophene, Furan, Crown Ether (18-crown-6).
            - **Multi-Reactant Mode Toggle**: AppBar toggle for multi-fragment drawing mode.
            - **Load from SMILES**: Paste any SMILES string to instantly render on canvas.
