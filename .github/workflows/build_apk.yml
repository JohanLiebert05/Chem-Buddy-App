name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.3-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.3-apk
          path: ChemBuddy-v3.4.3-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.3-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.3)
            
            ### 🔬 What's Fixed & Upgraded in v3.4.3:
            - **Attendance Tracker Layout Crash Fix**: Resolved the RenderFlex overflow ("Render Hiccup Encountered") occurring on standard and compact mobile viewports (e.g. iPhone/Android 360px–393px) in the timetable reference photo header. All dynamic text rows now utilize constrained `Expanded` layout with ellipsis handling.
            - **Attendance Embedded Error Boundary**: Wrapped the embedded Attendance tab in `ClassesHubScreen` within an isolated `AppErrorBoundary` to prevent any sub-component layout issues from replacing the entire screen with an error card.
            - **ChemBuddy General AI Mode & Live Internet Access**: Transparent multi-model failover (`gemini-3-flash-preview`, `gemini-flash-latest`, `gemini-3.6-flash`, `text-embedding-004`) across 4 Google Gemini API keys.
            - **ChemDraw Canvas Restored**: Full touch drawing, smart auto-benzene placement, and functional group palette.
            - **Handwritten Notes → OCR → Flashcards**: Multi-page gallery scans and camera captures synthesized directly into study flashcards.
            - **Passing Automated Tests**: 100% test suite parity across automated unit, widget, and integration tests.

