name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v2.8.0-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v2.8.0-apk
          path: ChemBuddy-v2.8.0-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v2.8.0-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 2.8.0)
            
            ### ✨ What's New in v2.8.0:
            - **Kannada Scholar Bunny Mascot**:
              - New character with transparent WebP asset, Kannada ("ಕನ್ನಡಿಗ") hat insignia, safety goggles, and bubbling flask.
              - `InteractiveMascot` widget with vertical floating, head tilt, squash-and-stretch bounce, dynamic neon back-glow (Cyan, Green, Purple), and tap-to-reveal study quips.
            - **Unified LaTeX & Mathematical Rendering**:
              - Consolidated `ChemistryMarkdownView` engine with automatic naked LaTeX macro wrapping and ATX markdown header normalization.
              - Standardized across all 16 MSc Chemistry Toolkit calculators, PDF Study Hub, Viva Practice, and Predicted Exam Questions.
            - **Polymer & Biomolecule Molar Mass Architecture**:
              - Curated database of 28 key polymers and biomolecules with repeating unit formulas, repeat unit molar masses, and variable chain length notices.
              - Word-boundary regex matching preventing substring false collisions.
            - **Quality & Verification**:
              - 100% test pass rate across 166 automated unit & widget tests.
              - Zero static analysis warnings (`flutter analyze`).
