name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.0-by-Prajwal-A-Kambar.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.5.0-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.5.0-apk
          path: ChemBuddy-v3.5.0-by-Prajwal-A-Kambar.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.5.0-by-Prajwal-A-Kambar.apk
            ChemBuddy-v3.5.0-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
          body: |
            # ChemBuddy ${{ github.ref_name }} — by Prajwal A Kambar
            
            > **Chem Buddy by Prajwal A Kambar** — attendance, tests, and notes for MSc Chemistry students.
            
            ---
            
            ### ✨ What's New & Upgraded in ${{ github.ref_name }}:
            
            #### ⏰ 1. IST 8:30 AM Timetable Briefing & 1-Tap Class Attendance Alerts
            - **Strict IST Enforced**: All notifications anchored to `Asia/Kolkata` timezone.
            - **8:30 AM Timetable Briefing**: Daily morning overview with attendance warnings and witty chemistry briefing.
            - **1-Tap Action Shade**: Class reminders now have direct `Present ✅` and `Absent ❌` action buttons to log attendance without opening the app.
            
            #### 🧠 2. Daily Psychology Facts Notifications
            - **120+ Curated Facts**: Inspired by the "Psychology Facts" app, spanning Cognitive Biases, Memory, Social Dynamics, Brain Neuroscience, Emotional Intelligence, Attraction, and Habits.
            - **Daily Once at 8:00 PM**: Scheduled evening reflection with prime-weighted calendar rotation ensuring each day receives a unique, non-repeating fact.
            - **In-App Dashboard Card**: Interactive psychology fact widget on the Home Screen with category tags and on-demand shuffle.
            
            #### 💬 3. Claude-Inspired Smart Home Greeting & Complete AI Answers
            - **40+ Contextual Greetings**: Dynamically adapting to time, day-of-week, and real-time attendance percentage.
            - **No More Truncation**: Quadrupled `maxOutputTokens` to 8192 with strict comprehensive explanation prompts.
            
            #### 🔬 4. Spectroscopy Structure Solver Intelligence
            - **52+ Curated MSc Compounds**: Full identification for Aspirin, Paracetamol, Benzoic Acid, Salicylic Acid, Vanillin, 1-Bromopropane, 2-Bromopropane, etc.
            - **Isomer Ruling-Out**: Explains systematically why constitutional isomers are excluded.
            - **Algorithmic Solver**: Handles arbitrary unlisted formulas with DBE, FT-IR, NMR splitting, and MS fragmentation analysis.
            
            #### 🧪 5. ChemDraw Pro & Ketcher Pro Canvas
            - **Full 118-Element Periodic Table**: Searchable modal with CPK coloring and category filters.
            - **Pro Tools**: Formal charges (`+1`, `-1`, `+2`, `-2`), marquee selection (`⬚`), 2D clean-up (`🧹`), and non-destructive templates.
            - **Decluttered Dock**: Tabbed bottom dock and optimized mobile drawing area.
            
            #### ⚡ 6. Reaction Product Prediction & 2D Vector SVG Output
            - **45+ Instant Offline Rules**: Zero-latency, 100% accurate prediction for standard MSc organic reactions.
            - **2D Vector SVG Generator**: Converts predicted SMILES into clean, publication-quality 2D vector SVGs with CPK heteroatoms and textbook coordinates, replacing raw text boxes.
            
            #### 🛡️ 7. Verification & Reliability
            - 100% passing test suite (**365/365 tests passed**).
            - Zero errors, zero warnings, zero lints on `flutter analyze`.
            
            ---
            *Developed with ❤️ by Prajwal A Kambar*



