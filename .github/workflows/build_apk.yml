name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.3.1-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.3.1-apk
          path: ChemBuddy-v3.3.1-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.3.1-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.3.1)
            
            ### 🔬 What's Fixed & Upgraded in v3.3.1:
            - **Dedicated "+" Button**: Direct `＋` tool button in the ChemDraw canvas toolbar and `+ Reactant` badge button in the status strip to easily place reactant addition symbols between molecules.
            - **Real Gemini 3.6 Flash Multi-Key Dispatcher**: Upgraded AI reaction engine to Google Gemini 3.6 Flash with 100% resilient multi-key failover pool. Replaced mock text fallbacks with authentic chemical SMILES and mechanisms.
            - **Dynamic AI SVG Mechanism Viewer**: Interactive animated mechanism steps with curved electron-pushing flows and intermediate structures now render beautifully for any AI-predicted reaction.
            - **Seamless Full Mechanism Navigation**: Tapping "Full Mechanism" on ChemDraw directly opens the Animated Mechanism Viewer instead of the text chat screen.
            - **2D NIH Cactus Vector Structures**: Authentic 2D molecular SVGs populated directly from Cactus for predicted reaction products.
