name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.1-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.1-apk
          path: ChemBuddy-v3.4.1-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.1-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.1)
            
            ### 🔬 What's Fixed & Upgraded in v3.4.1:
            - **ChemDraw Canvas Restored**: Fixed JavaScript syntax error caused by missing loop closing brace in eraserMode handler, restoring touch-drawing, auto-benzene placement, and tool selection on canvas.
            - **Handwritten Notes → OCR → Flashcards**: Upload camera photos or multi-page gallery scans of handwritten chemistry notes to automatically transcribe formulas, correct OCR mixups, and synthesize active-recall flashcards.
            - **ChemDraw Intelligence Suite**: Fixed SMILES generation with two-pass DFS ring closure, reactant addition (+) markers, touch zoom/pan, eraser tool, and expanded MSc template library.
            - **UI & Stability Polish**: Resolved bottom navigation bar hiding under keyboard and upgraded chemistry notifications with witty quips.
            - **Google Gemini 2.5 Flash Engine**: Free-tier high-speed multimodal reasoning and flashcard extraction.
