name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy Named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ChemBuddy-v3.4.2-Release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "Chem-Buddy-MSc-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-v3.4.2-apk
          path: ChemBuddy-v3.4.2-Release.apk
          retention-days: 30

      - name: Create GitHub Release (Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ChemBuddy-v3.4.2-Release.apk
            Chem-Buddy-MSc-Release.apk
          name: ChemBuddy Release ${{ github.ref_name }}
          body: |
            ## ChemBuddy Release ${{ github.ref_name }} (Version 3.4.2)
            
            ### 🔬 What's Fixed & Upgraded in v3.4.2:
            - **ChemBuddy General AI Mode & Live Internet Access**: ChemBuddy AI is no longer restricted to static offline responses. It now features live Google Gemini access (`gemini-3-flash-preview` with automatic key rotation and multi-model failover) to answer any chemistry, scientific, academic, or general knowledge question.
            - **New '✨ General AI' Mode**: Added a dedicated General AI chip in the mode bar alongside MSc Concept, Mechanisms, Simple, and Exam modes.
            - **Direct Client & Supabase Fallback Architecture**: When edge functions time out or return 401 for guest sessions, queries instantly and transparently fall back to client-orchestrated Google Gemini AI over the internet before any offline knowledge base fallback.
            - **ChemDraw Canvas Restored**: Fixed touch-drawing, auto-benzene placement, and tool selection on the interactive chemical sketcher canvas.
            - **Handwritten Notes → OCR → Flashcards**: Multi-page gallery scans and camera captures synthesized directly into study flashcards.
            - **Clean Lints & Passing Automated Tests**: 100% test suite parity across 328 automated unit, widget, and integration tests.

