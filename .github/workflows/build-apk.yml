name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Chem-Buddy-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chem-buddy-apk
          path: Chem-Buddy-2.0.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Chem Buddy 2.0
          files: Chem-Buddy-2.0.0.apk
