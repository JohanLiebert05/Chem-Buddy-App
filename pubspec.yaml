name: chem_buddy
description: Chem Buddy — attendance, tests, and notes for MSc Chemistry students.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  file_picker: ^8.1.6
  flutter_pdfview: ^1.3.4
  share_plus: ^10.1.4
  android_intent_plus: ^5.3.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
