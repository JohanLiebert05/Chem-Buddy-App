name: chem_buddy
description: Chem Buddy — attendance, tests, and notes for MSc Chemistry students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
