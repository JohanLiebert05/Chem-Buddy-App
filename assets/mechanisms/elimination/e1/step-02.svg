<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>E1 reaction mechanism - step 2</title>
  <desc>Water abstracts a beta-hydrogen. The C-H bonding pair forms the C=C pi bond of 2-methylpropene. No rearrangement is required for this tert-butyl cation.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">beta-deprotonation</text></g>
  <g id="intermediate-1">
    <text x="70" y="208" font-family="sans-serif" font-size="18">H₂O</text>
    <circle cx="119" cy="189" r="2"/><circle cx="119" cy="198" r="2"/>
    <text x="179" y="145" font-family="sans-serif" font-size="16">H</text>
    <path d="M 192 146 L 237 183 L 307 202 M 307 202 L 373 167 M 307 202 L 365 249" fill="none" stroke="#111" stroke-width="2.1"/>
    <text x="307" y="184" font-size="17" font-family="sans-serif">+</text>
  </g>
  <g id="electron-arrows">
    <path d="M 119 193.5 C 133 156 156 134 179 139" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 214.5 164.5 C 232 136 271 153 272 192.5" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels">
    <text x="90" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">O to beta-H</text>
    <text x="270" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">C-H to C-C</text>
  </g>

</svg>
