<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>Diels-Alder reaction mechanism - step 1</title>
  <desc>s-cis 1,3-butadiene and ethene aligned for [4+2] cycloaddition. Three two-electron arrows in a cycle: one terminal diene pi bond forms a sigma bond to ethene, the ethene pi bond forms the other sigma bond, and the second diene pi bond moves to the central diene bond. Concerted, no intermediate.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">heat; concerted [4+2]</text></g>
  <g id="reactants">
    <path d="M 235 207 L 286 123 L 374 123 L 425 207 M 244 209 L 293 131 M 367 131 L 416 209 M 286 275 L 374 275 M 286 268 L 374 268"
      fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g id="electron-arrows">
    <path d="M 268 170 C 295 187 292 222 265 241" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 330 268 C 345 235 367 229 398 241" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 391.5 170 C 372 198 332 184 330 123" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels"><text x="225" y="321" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">1,3-butadiene + ethene</text></g>

</svg>
