<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img">
  <title>Methyl addition to acetone</title>
  <desc>The methyl–magnesium bonding pair forms the carbon–carbon bond as the carbonyl pi pair moves to oxygen.</desc>
  <defs><marker id="electron-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#24435F" stroke-width="2"/></marker></defs>
  <rect width="640" height="320" fill="#F9FAFE"/>
  <g id="reactants" font-family="sans-serif" font-size="21" fill="#233144">
    <text x="320" y="38" text-anchor="middle" font-size="18">Methyl addition to acetone</text>
    <text x="77" y="179">BrMg</text><text x="192" y="179">CH₃</text><text x="292" y="180">+</text>
<text x="355" y="225">Me</text><text x="466" y="88">O</text><text x="558" y="225">Me</text>
<path d="M 126 173 H 185 M 389 211 L 477 171 L 553 211 M 472 173 V 96 M 482 173 V 96" fill="none" stroke="#233144" stroke-width="3"/>
<g id="electron-arrows" fill="none" stroke="#24435F" stroke-width="2"><path d="M 155.5 173 C 206 90 394 88 469 161" marker-end="url(#electron-arrow)"/>
<path d="M 482 134 Q 519 112 485 87" marker-end="url(#electron-arrow)"/></g>
    <text x="320" y="295" text-anchor="middle" font-size="15">Formal C–Mg bond-pair transfer gives the magnesium alkoxide.</text>
  </g>
</svg>
