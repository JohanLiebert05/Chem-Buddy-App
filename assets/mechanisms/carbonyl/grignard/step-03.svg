<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>Grignard reaction mechanism - step 3</title>
  <desc>Aqueous acid protonates the alkoxide oxygen to give tert-butanol.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">H3O+ workup</text></g>
  <g id="products">
    <path d="M 230 200 L 161 156 M 230 200 L 160 249 M 230 200 L 229 271 M 230 200 L 300 200 M 452 200 L 496 200 M 516 189 L 543 160 M 516 209 L 542 241" fill="none" stroke="#111" stroke-width="2.1"/>
    <text x="302" y="205" font-family="sans-serif" font-size="18">O⁻</text>
    <circle cx="334" cy="189" r="2"/><circle cx="334" cy="198" r="2"/>
    <text x="432" y="206" font-family="sans-serif" font-size="18">H</text>
    <text x="500" y="206" font-family="sans-serif" font-size="18">O⁺</text>
    <text x="545" y="161" font-family="sans-serif" font-size="18">H</text>
    <text x="545" y="249" font-family="sans-serif" font-size="18">H</text>
  </g>
  <g id="electron-arrows">
    <path d="M 334 193.5 C 363 157 407 155 436 190" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 474 200 C 461 229 490 236 504 214" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels">
    <text x="260" y="311" font-family="sans-serif" font-size="13" fill="#444">Products: tert-butanol and water</text>
  </g>

</svg>
