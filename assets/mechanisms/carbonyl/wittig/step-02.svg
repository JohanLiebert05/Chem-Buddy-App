<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>Wittig reaction mechanism - step 2</title>
  <desc>Oxaphosphetane. Oxygen bonds to phosphorus. Collapse: C-P bonding pair to form the alkene and P-O of Ph3P=O. Li-salt-free conditions favor this [2+2] path over a long-lived betaine.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">oxaphosphetane (not a free betaine under salt-free conditions)</text></g>
  <g id="intermediate-1">
    <path d="M 266 138 H 369 M 389 149 V 228 H 252 M 247 218 V 151 M 389 228 L 451 194 M 389 228 L 450 268"
      fill="none" stroke="#111" stroke-width="2.2"/>
    <text x="205" y="144" font-family="sans-serif" font-size="18">Ph₃P</text>
    <text x="380" y="144" font-family="sans-serif" font-size="18">O</text>
    <text x="216" y="233" font-family="sans-serif" font-size="17">CH₂</text>
  </g>
  <g id="electron-arrows">
    <path d="M 247 190 C 204 199 240 260 315 228" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 389 188 C 422 157 370 105 317 138" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels">
    <text x="208" y="312" font-family="sans-serif" font-size="14">Cycloreversion forms C=C and P=O together</text>
  </g>

</svg>
