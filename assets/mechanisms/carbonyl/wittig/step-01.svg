<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>Wittig reaction mechanism - step 1</title>
  <desc>The salt-free pathway is represented as a formal concerted cycloaddition of the ylide and acetone. The two pi pairs form C–C and P–O bonds.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">Ph3P=CH2 + acetone</text></g>
  <g id="reactants">
    <path d="M 248 147 V 222 M 256 147 V 222 M 418 147 V 230 M 426 147 V 230 M 422 230 L 484 199 M 422 230 L 484 266"
      fill="none" stroke="#111" stroke-width="2.2"/>
    <text x="214" y="139" font-family="sans-serif" font-size="18">Ph₃P</text>
    <text x="230" y="244" font-family="sans-serif" font-size="18">CH₂</text>
    <text x="415" y="139" font-family="sans-serif" font-size="18">O</text>
  </g>
  <g id="electron-arrows">
    <path d="M 256 185 C 283 176 329 192 337 231" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 418 187 C 393 201 344 176 337 135" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels">
    <text x="192" y="310" font-family="sans-serif" font-size="14">Formal [2+2]: C–C and P–O bonds form in one step</text>
  </g>

</svg>
