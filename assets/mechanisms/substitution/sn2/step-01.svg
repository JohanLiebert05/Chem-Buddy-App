<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>SN2 reaction mechanism - step 1</title>
  <desc>Hydroxide backside attack on (S)-2-bromobutane. A two-electron arrow from the oxygen lone pair to C2 and a two-electron arrow from the C2-Br bond to bromine occur in the same concerted step.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions">
    <text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">NaOH, DMSO</text>
  </g>

  <g id="reactants">
    <g id="hydroxide">
      <line x1="46" y1="188" x2="78" y2="200" stroke="#111111" stroke-width="2.1" stroke-linecap="round"/>
      <text x="28" y="194" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">H</text>
      <text x="80" y="208" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#111111">O</text>
      <text x="102" y="176" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">-</text>
      <ellipse cx="78" cy="184" rx="2.2" ry="2.2" fill="#111111"/>
      <ellipse cx="88" cy="180" rx="2.2" ry="2.2" fill="#111111"/>
      <ellipse cx="78" cy="218" rx="2.2" ry="2.2" fill="#111111"/>
      <ellipse cx="88" cy="222" rx="2.2" ry="2.2" fill="#111111"/>
      <ellipse id="lp-source" cx="112" cy="198" rx="2.2" ry="2.2" fill="#111111"/>
      <ellipse cx="112" cy="208" rx="2.2" ry="2.2" fill="#111111"/>
    </g>

    <g id="alkyl-bromide">
      <line id="c-br-bond" x1="300" y1="200" x2="392" y2="200" stroke="#111111" stroke-width="2.1" stroke-linecap="round"/>
      <text x="398" y="208" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#111111">Br</text>
      <line x1="300" y1="200" x2="338" y2="262" stroke="#111111" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="338" y1="262" x2="402" y2="262" stroke="#111111" stroke-width="2.1" stroke-linecap="round"/>
      <polygon id="wedge-me" points="300,200 268,108 292,108" fill="#111111"/>
      <text x="236" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">CH3</text>
      <g id="hash-h">
        <line x1="294" y1="214" x2="306" y2="214" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="291" y1="226" x2="309" y2="226" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="288" y1="238" x2="312" y2="238" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="285" y1="250" x2="315" y2="250" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="282" y1="262" x2="318" y2="262" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="279" y1="274" x2="321" y2="274" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="268" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111111">H</text>
    </g>
  </g>

  <g id="electron-arrows">
    <path d="M 118 196 C 175 128 240 136 288 186" fill="none" stroke="#111111" stroke-width="1.7" marker-end="url(#electron-arrow)"/>
    <path d="M 348 192 C 372 148 396 150 418 184" fill="none" stroke="#111111" stroke-width="1.7" marker-end="url(#electron-arrow)"/>
  </g>

  <g id="labels">
    <text x="70" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444444">nucleophile</text>
    <text x="318" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444444">(S)-2-bromobutane</text>
    <text x="430" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444444">leaving group</text>
    <text x="168" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555">lone pair to C</text>
    <text x="348" y="138" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555">C-Br to Br</text>
  </g>
</svg>
