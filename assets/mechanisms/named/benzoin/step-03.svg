<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img">
  <title>Cyanide leaves and the carbonyl reforms</title>
  <desc>After proton transfer, the first oxygen reforms its carbonyl as the carbon–cyanide bond cleaves.</desc>
  <defs><marker id="electron-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#24435F" stroke-width="2"/></marker></defs>
  <rect width="640" height="320" fill="#F9FAFE"/>
  <g id="reactants" font-family="sans-serif" font-size="21" fill="#233144">
    <text x="320" y="38" text-anchor="middle" font-size="18">Cyanide leaves and the carbonyl reforms</text>
    <text x="94" y="181">Ph</text><text x="186" y="103">O⁻</text><text x="185" y="252">CN</text>
<circle cx="174" cy="106" r="2.5"/><circle cx="174" cy="115" r="2.5"/>
<text x="296" y="181">CH</text><text x="293" y="110">OH</text><text x="400" y="181">Ph</text>
<path d="M 126 174 H 201 H 290 M 201 174 V 112 M 201 174 V 232 M 309 163 V 119 M 330 174 H 392" fill="none" stroke="#233144" stroke-width="3"/>
<g id="electron-arrows" fill="none" stroke="#24435F" stroke-width="2"><path d="M 174 110.5 Q 149 141 201 143" marker-end="url(#electron-arrow)"/>
<path d="M 201 203 Q 236 218 214 239" marker-end="url(#electron-arrow)"/></g>
    <text x="320" y="295" text-anchor="middle" font-size="15">After proton transfers: Ph–C(=O)–CH(OH)–Ph + CN⁻.</text>
  </g>
</svg>
