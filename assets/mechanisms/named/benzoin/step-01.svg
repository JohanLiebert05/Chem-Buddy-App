<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img">
  <title>Cyanide addition to benzaldehyde</title>
  <desc>Cyanide carbon adds to the aldehyde carbon while the carbonyl pi pair shifts to oxygen.</desc>
  <defs><marker id="electron-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#24435F" stroke-width="2"/></marker></defs>
  <rect width="640" height="320" fill="#F9FAFE"/>
  <g id="reactants" font-family="sans-serif" font-size="21" fill="#233144">
    <text x="320" y="38" text-anchor="middle" font-size="18">Cyanide addition to benzaldehyde</text>
    <text x="142" y="180">N≡C⁻</text><circle cx="190" cy="157" r="2.5"/><circle cx="190" cy="166" r="2.5"/>
<text x="241" y="181">+</text>
<text x="286" y="181">Ph</text><text x="389" y="84">O</text><text x="467" y="181">H</text>
<path d="M 316 174 H 399 H 460 M 394 173 V 92 M 404 173 V 92" fill="none" stroke="#233144" stroke-width="3"/>
<g id="electron-arrows" fill="none" stroke="#24435F" stroke-width="2"><path d="M 190 161.5 C 235 100 341 104 392 164" marker-end="url(#electron-arrow)"/>
<path d="M 404 130 Q 442 110 408 83" marker-end="url(#electron-arrow)"/></g>
    <text x="320" y="295" text-anchor="middle" font-size="15">Proton transfer then gives the carbon nucleophile for step 2.</text>
  </g>
</svg>
