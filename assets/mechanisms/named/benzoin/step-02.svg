<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img">
  <title>Acyl anion equivalent adds to a second aldehyde</title>
  <desc>The carbon nucleophile from the cyanohydrin adds to a second benzaldehyde.</desc>
  <defs><marker id="electron-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#24435F" stroke-width="2"/></marker></defs>
  <rect width="640" height="320" fill="#F9FAFE"/>
  <g id="reactants" font-family="sans-serif" font-size="21" fill="#233144">
    <text x="320" y="38" text-anchor="middle" font-size="18">Acyl anion equivalent adds to a second aldehyde</text>
    <text x="90" y="183">Ph</text><text x="175" y="105">OH</text><text x="173" y="256">CN</text><text x="203" y="181">⁻</text>
<circle cx="215" cy="155" r="2.5"/><circle cx="215" cy="164" r="2.5"/>
<text x="315" y="181">+</text><text x="365" y="182">Ph</text><text x="462" y="93">O</text><text x="551" y="182">H</text>
<path d="M 121 175 H 188 V 114 M 188 175 V 236 M 397 174 H 472 H 544 M 467 173 V 101 M 477 173 V 101" fill="none" stroke="#233144" stroke-width="3"/>
<g id="electron-arrows" fill="none" stroke="#24435F" stroke-width="2"><path d="M 215 159.5 C 272 98 405 104 466 164" marker-end="url(#electron-arrow)"/>
<path d="M 477 135 Q 515 118 481 93" marker-end="url(#electron-arrow)"/></g>
    <text x="320" y="295" text-anchor="middle" font-size="15">The first aldehyde carbon acts as a nucleophile after umpolung.</text>
  </g>
</svg>
