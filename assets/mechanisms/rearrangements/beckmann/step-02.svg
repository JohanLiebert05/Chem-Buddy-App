<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img">
  <title>Beckmann rearrangement mechanism - step 2</title>
  <desc>Nitrilium-like ring expansion intermediate is hydrated. Water attacks carbon; tautomerization gives epsilon-caprolactam.</desc>
  <defs>
    <marker id="electron-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111111"/>
    </marker>
    <marker id="fishhook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 2 L 10 5 L 0 5 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <g id="conditions"><text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">hydration</text></g>
  <g id="intermediate-1">
    <path d="M 278 191 L 305 253 L 372 270 L 432 229 L 443 168 L 405 115 L 385 123 M 359 122 L 278 185 M 363 128 L 282 191 M 367 133 L 286 197"
      fill="none" stroke="#111" stroke-width="2.2"/>
    <text x="365" y="129" font-family="sans-serif" font-size="18">N⁺</text>
    <text x="98" y="218" font-family="sans-serif" font-size="18">H₂O</text>
    <circle cx="142" cy="200" r="2"/><circle cx="142" cy="208" r="2"/>
  </g>
  <g id="electron-arrows">
    <path d="M 142 204 C 178 153 237 145 275 184" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
    <path d="M 322 160 C 306 128 337 101 365 114" fill="none" stroke="#111" stroke-width="2" marker-end="url(#electron-arrow)"/>
  </g>
  <g id="labels"><text x="200" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#444">Water attacks nitrilium carbon; a π pair moves onto N</text></g>

</svg>
