<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img">
  <title>Aldol addition of the enolate</title>
  <desc>The carbon-centered enolate resonance form adds to acetaldehyde as the acceptor carbonyl pair moves to oxygen.</desc>
  <defs><marker id="electron-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#24435F" stroke-width="2"/></marker></defs>
  <rect width="640" height="320" fill="#F9FAFE"/>
  <g id="reactants" font-family="sans-serif" font-size="21" fill="#233144">
    <text x="320" y="38" text-anchor="middle" font-size="18">Aldol addition of the enolate</text>
    <text x="105" y="180">H</text><text x="164" y="87">O</text><text x="245" y="182">CH₂⁻</text>
<circle cx="290" cy="153" r="2.5"/><circle cx="290" cy="162" r="2.5"/>
<text x="320" y="179">+</text><text x="367" y="181">Me</text><text x="464" y="89">O</text><text x="546" y="180">H</text>
<path d="M 125 174 H 175 H 239 M 170 173 V 95 M 180 173 V 95 M 399 174 H 475 H 539 M 470 173 V 97 M 480 173 V 97" fill="none" stroke="#233144" stroke-width="3"/>
<g id="electron-arrows" fill="none" stroke="#24435F" stroke-width="2"><path d="M 290 157.5 C 320 112 427 108 468 165" marker-end="url(#electron-arrow)"/>
<path d="M 480 134 Q 512 113 483 88" marker-end="url(#electron-arrow)"/></g>
    <text x="320" y="295" text-anchor="middle" font-size="15">Carbon-centered enolate resonance form shown.</text>
  </g>
</svg>
